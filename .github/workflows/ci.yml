name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install poetry
      - run: poetry install --with dev
      - run: poetry run ruff check .
      - run: poetry run pytest -q
      - name: Offline retrieval eval (regression gate)
        run: poetry run python -m eval.run_retrieval_eval --min-recall-at-10 0.90 --output "$RUNNER_TEMP/retrieval.json"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jarvis .
