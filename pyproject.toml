[project]
name = "jarvis"
version = "0.1.0"
description = "Joint Archival Retrieval of Verbose Information Systems"
authors = [
    {name = "Lukasz Wisniewski",email = "11744669+lukaszwisniewski@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.136.1,<0.137.0",
    "uvicorn[standard]>=0.46.0,<0.47.0",
    "anthropic>=0.100.0,<0.101.0",
    "pydantic-settings>=2.14.1,<3.0.0",
    "celery[redis]>=5.6.3,<6.0.0",
    "httpx>=0.28.1,<0.29.0",
    "python-multipart>=0.0.31,<0.0.32",
    "langgraph (>=1.2.20,<2.0.0)",
    "prometheus-client (>=0.26.0,<0.27.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pre-commit (>=4.6.0,<5.0.0)",
    "ruff (>=0.12.0,<1.0.0)",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/llm/prompts.py" = ["E501"]  # prompt text must not be re-wrapped

[tool.poetry]
package-mode = false
