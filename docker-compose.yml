name: jarvis

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    # Override NO_PROXY to avoid httpx InvalidURL error from IPv6 subnet injected by Orbstack or host
    environment:
      - REDIS_URL=redis://redis:6379/0
      - NO_PROXY=localhost,127.0.0.1,redis
      - no_proxy=localhost,127.0.0.1,redis
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app  # mounts local code into container so --reload picks up changes

  worker:
    build: .
    env_file: .env
    # Override NO_PROXY to avoid httpx InvalidURL error from IPv6 subnet injected by Orbstack or host
    environment:
      - REDIS_URL=redis://redis:6379/0
      - NO_PROXY=localhost,127.0.0.1,redis
      - no_proxy=localhost,127.0.0.1,redis
      # Worker only: prefork children write metric values to files here, and
      # the worker parent serves their sum on port 9100.
      - PROMETHEUS_MULTIPROC_DIR=/tmp/jarvis-metrics
    tmpfs:
      - /tmp/jarvis-metrics
    ports:
      - "9100:9100"
    depends_on:
      - redis
    # Clear old metric files in a separate step before Celery starts.
    command: sh -c "python -m app.observability.worker_metrics && exec celery -A app.workers.celery_app:celery_app worker --loglevel=info"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
